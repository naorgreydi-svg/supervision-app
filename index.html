<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>מערכת ניהול פיקוח עליון</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            /* הגדרת הצבעים החדשים שלך */
            --bg-color: rgb(200, 230, 255);
            --primary-color: #007bff; /* כחול במקום הסגול */
            --primary-hover: #0056b3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #ffffff 100%);
            min-height: 100vh;
            direction: rtl;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* מסכי התחברות */
        .auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .auth-box h1 { color: var(--primary-color); text-align: center; margin-bottom: 20px; }

        /* טפסים */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, textarea, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        
        /* כפתורים */
        .btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: var(--primary-hover); }
        .btn-add { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* ממשק ראשי */
        .app-screen { display: none; }
        .app-screen.active { display: block; }
        .header { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .content-box { background: white; padding: 30px; border-radius: 15px; min-height: 500px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .project-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .project-card:hover { border-color: var(--primary-color); background: #f8f9fa; }

        /* מודאלים */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .close-modal { float: left; font-size: 24px; cursor: pointer; background: none; border: none; }

        /* PDF Viewer Styling */
        .pdf-viewer { display: flex; gap: 20px; margin-top: 20px; flex-direction: column; }
        .pdf-canvas-container { position: relative; overflow: auto; max-height: 70vh; border: 1px solid #ccc; }
        #pdfCanvas { display: block; }
        #drawingCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
        
        /* התאמה למובייל */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            .pdf-viewer { width: 100%; }
        }
    </style>
</head>
<body>
<div id="loginScreen" class="auth-screen">
        <div class="auth-box">
            <h1>🏗️ מערכת פיקוח</h1>
            <div id="loginError" style="color: red; display: none;"></div>
            <form id="loginForm">
                <div class="form-group"><label>מייל</label><input type="email" id="loginEmail" required></div>
                <div class="form-group"><label>סיסמה</label><input type="password" id="loginPassword" required></div>
                <button type="submit" class="btn">התחבר</button>
            </form>
            <p style="text-align: center; margin-top: 15px; cursor: pointer; color: blue;" onclick="showRegister()">אין חשבון? הירשם</p>
        </div>
    </div>

    <div id="registerScreen" class="auth-screen" style="display: none;">
        <div class="auth-box">
            <h1>הרשמה</h1>
            <div id="registerError" style="color: red; display: none;"></div>
            <form id="registerForm">
                <div class="form-group"><label>שם מלא</label><input type="text" id="registerName" required></div>
                <div class="form-group"><label>מייל</label><input type="email" id="registerEmail" required></div>
                <div class="form-group"><label>סיסמה</label><input type="password" id="registerPassword" required></div>
                <button type="submit" class="btn">הירשם</button>
            </form>
            <p style="text-align: center; margin-top: 15px; cursor: pointer; color: blue;" onclick="showLogin()">חזור להתחברות</p>
        </div>
    </div>

    <div id="appScreen" class="app-screen">
        <div class="container">
            <div class="header">
                <h2>מערכת פיקוח עליון</h2>
                <div>
                    <span id="userName">שם משתמש</span>
                    <button onclick="logout()" style="background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; margin-right: 10px;">התנתק</button>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <button onclick="showTab('projects')" class="btn" style="width: auto; margin-left: 10px;">פרויקטים</button>
                <button onclick="showTab('emails')" class="btn" style="width: auto; background: gray;">ניהול מיילים</button>
            </div>

            <div class="content-box">
                <div id="projectsTab" class="tab-content active">
                    <button class="btn-add" onclick="document.getElementById('addProjectModal').classList.add('active')">+ פרויקט חדש</button>
                    <div id="projectList" style="margin-top: 20px;"></div>
                </div>

                <div id="emailsTab" class="tab-content">
                    <h3>מיילים מאושרים</h3>
                    <input type="email" id="newAllowedEmail" placeholder="הכנס מייל לאישור">
                    <button onclick="addAllowedEmail()" class="btn-add">הוסף</button>
                    <div id="emailList" style="margin-top: 20px;"></div>
                </div>

                <div id="projectDetailsTab" class="tab-content">
                    <button onclick="showTab('projects')" style="margin-bottom: 10px;">חזרה</button>
                    <h2 id="projectTitle"></h2>
                    <div id="inspectionList"></div>
                    <button class="btn-add" onclick="openAddInspectionModal()">+ הוסף פיקוח</button>
                </div>

                <div id="inspectionDetailsTab" class="tab-content">
                    <button onclick="showTab('projects')">חזרה לפרויקטים</button>
                    <h3 id="inspectionTitle"></h3>
                    
                    <div style="margin: 20px 0;">
                         <input type="file" id="pdfFileInput" accept=".pdf" onchange="handlePdfUpload(event)">
                    </div>

                    <div id="pdfViewerSection" style="display: none;">
                        <div style="margin-bottom: 10px;">
                            <button onclick="selectTool('rect')">מלבן</button>
                            <button onclick="selectTool('circle')">עיגול</button>
                            <button onclick="exportToPdf()" style="background: purple; color: white;">ייצוא לדוח PDF</button>
                        </div>
                        <div class="pdf-canvas-container">
                            <canvas id="pdfCanvas"></canvas>
                            <canvas id="drawingCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="addProjectModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="this.parentElement.parentElement.classList.remove('active')">×</button>
            <h3>הוסף פרויקט</h3>
            <input type="text" id="newProjectName" placeholder="שם הפרויקט" style="width: 100%; margin: 10px 0; padding: 10px;">
            <button class="btn" onclick="addNewProject()">שמור</button>
        </div>
    </div>
    <script>
    // הגדרות Firebase - אל תשנה את זה
    const firebaseConfig = {
        apiKey: "AIzaSyCuxnE-K8Mu-E2i0OKwQ7l6o5_slRlsXUA",
        authDomain: "supervision-system-7b58d.firebaseapp.com",
        projectId: "supervision-system-7b58d",
        storageBucket: "supervision-system-7b58d.firebasestorage.app",
        messagingSenderId: "655286668860",
        appId: "1:655286668860:web:f442509a3ac07b14f8fd39",
        measurementId: "G-FKWZ0BBX86"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // משתנים גלובליים
    let currentUser = null;
    let currentProject = null;
    let currentInspection = null;

    // ==========================================
    // התיקון הקריטי: סדר טעינה נכון
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                console.log('✅ משתמש מחובר:', user.email);
                // 1. טוען פרטי משתמש
                await loadUserData(user);
                // 2. טוען את נתוני האפליקציה (בצורה בטוחה)
                loadApplicationData(); 
            } else {
                console.log('❌ לא מחובר');
                showLogin();
            }
        });
    });

    async function loadUserData(user) {
        // כאן הקוד שלך שטוען את המשתמש ומגדיר אם הוא Admin
        currentUser = { uid: user.uid, email: user.email, name: user.displayName || 'משתמש' };
        document.getElementById('userName').textContent = currentUser.name;
        showApp();
    }

    // הפונקציה הזו מרכזת את כל הטעינות שאסור שיקרו לפני התחברות
    function loadApplicationData() {
        console.log("טוען נתונים...");
        loadProjects(); // טוען את הפרויקטים
        // כאן אפשר להוסיף טעינת מיילים וכו'
    }

    // ניהול תצוגה
    function showLogin() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appScreen').classList.remove('active');
    }

    function showApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('registerScreen').style.display = 'none';
        document.getElementById('appScreen').classList.add('active');
    }

    // פונקציות התחברות
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
        } catch (error) { alert("שגיאה בהתחברות: " + error.message); }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const user = await auth.createUserWithEmailAndPassword(document.getElementById('registerEmail').value, document.getElementById('registerPassword').value);
            await user.user.updateProfile({ displayName: document.getElementById('registerName').value });
        } catch (error) { alert("שגיאה בהרשמה: " + error.message); }
    });

    function logout() { auth.signOut(); window.location.reload(); }

    // ניהול פרויקטים (שמירה ב-LocalStorage כרגע לפשטות)
    function loadProjects() {
        const projects = JSON.parse(localStorage.getItem('projects') || '[]');
        const list = document.getElementById('projectList');
        list.innerHTML = '';
        projects.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project-card';
            div.innerHTML = `<h3>${p.name}</h3>`;
            div.onclick = () => openProject(p.id);
            list.appendChild(div);
        });
    }

    function addNewProject() {
        const name = document.getElementById('newProjectName').value;
        const projects = JSON.parse(localStorage.getItem('projects') || '[]');
        projects.push({ id: Date.now(), name: name, inspections: [] });
        localStorage.setItem('projects', JSON.stringify(projects));
        document.getElementById('addProjectModal').classList.remove('active');
        loadProjects();
    }

    function openProject(id) {
        const projects = JSON.parse(localStorage.getItem('projects') || '[]');
        currentProject = projects.find(p => p.id === id);
        showTab('projectDetails');
        document.getElementById('projectTitle').innerText = currentProject.name;
        // כאן נטען את הפיקוחים...
    }

    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        if(tabName === 'projects') document.getElementById('projectsTab').classList.add('active');
        if(tabName === 'emails') document.getElementById('emailsTab').classList.add('active');
        if(tabName === 'projectDetails') document.getElementById('projectDetailsTab').classList.add('active');
        if(tabName === 'inspectionDetails') document.getElementById('inspectionDetailsTab').classList.add('active');
    }

        // ==========================================
    // חלק ה-PDF והציור
    // ==========================================
    
    // הגדרת ספריית ה-PDF
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentPdf = null;
    let isDrawing = false;
    let startX, startY;
    let drawingTool = 'rect';

    function openAddInspectionModal() {
        // יצירת פיקוח חדש דמה
        const newInsp = { id: Date.now(), name: 'פיקוח חדש ' + new Date().toLocaleDateString() };
        if(!currentProject.inspections) currentProject.inspections = [];
        currentProject.inspections.push(newInsp);
        localStorage.setItem('projects', JSON.stringify(JSON.parse(localStorage.getItem('projects')))); // שמירה
        openInspection(newInsp);
    }

    function openInspection(insp) {
        currentInspection = insp;
        showTab('inspectionDetails');
        document.getElementById('inspectionTitle').innerText = insp.name;
        document.getElementById('pdfViewerSection').style.display = 'none';
    }

    // טעינת PDF
    function handlePdfUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const pdfData = e.target.result;
            loadPdf(pdfData);
        };
        reader.readAsDataURL(file);
    }

    async function loadPdf(url) {
        const loadingTask = pdfjsLib.getDocument(url);
        currentPdf = await loadingTask.promise;
        renderPage(1);
        document.getElementById('pdfViewerSection').style.display = 'block';
    }

    async function renderPage(num) {
        const page = await currentPdf.getPage(num);
        const scale = 1.0;
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.getElementById('pdfCanvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const drawingCanvas = document.getElementById('drawingCanvas');
        drawingCanvas.height = viewport.height;
        drawingCanvas.width = viewport.width;

        const renderContext = {
            canvasContext: context,
            viewport: viewport
        };
        await page.render(renderContext).promise;
    }

    // לוגיקת ציור
    const dCanvas = document.getElementById('drawingCanvas');
    const ctx = dCanvas.getContext('2d');

    function selectTool(tool) { drawingTool = tool; }

    dCanvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        const rect = dCanvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
    });

    dCanvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        const rect = dCanvas.getBoundingClientRect();
        const currentX = e.clientX - rect.left;
        const currentY = e.clientY - rect.top;
        
        // נקה וצייר מחדש (סימולציה)
        // בקוד המלא יש לשמור את כל הציורים במערך ולצייר מחדש
        ctx.clearRect(0, 0, dCanvas.width, dCanvas.height);
        
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 3;
        
        if (drawingTool === 'rect') {
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
        } else if (drawingTool === 'circle') {
             ctx.beginPath();
             const radius = Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2));
             ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
             ctx.stroke();
        }
    });

    dCanvas.addEventListener('mouseup', () => { isDrawing = false; });

    // ייצוא
    function exportToPdf() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        
        // כאן משלבים את הקנבס לתוך ה-PDF
        const canvas = document.getElementById('pdfCanvas');
        const imgData = canvas.toDataURL('image/jpeg', 1.0);
        pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
        pdf.save("report.pdf");
    }

</script>
</body>
</html>
